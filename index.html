<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>The Course Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Archivo:wght@400;500&display=swap">
<style>
/* Layout: a bound catalogue &#8212; cover plate, sunk contents page, ruled group openers, large photographic plates each with a scorecard caption beneath. */
:root{
  /* Two voices, and only two. The serif is the content: course names, group
     titles, the editorial note. The sans is the apparatus around it: labels,
     figures, captions, controls. Nothing on the page uses a third face. */
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;

  /* One scale. Every size on the page is one of these six steps. */
  --fs-mark:10.5px;                     /* every uppercase label and mark */
  --fs-ui:13px;                         /* figures, secondary text, controls */
  --fs-prose:16px;                      /* serif reading text */
  --fs-entry:clamp(20px,2.5vw,24px);    /* a name: course, contents line, dek */
  --fs-feature:clamp(25px,3.2vw,32px);  /* the lead plate's name */
  --fs-opener:clamp(30px,4.6vw,40px);   /* group openers, drawn monograms */
  --fs-cover:clamp(46px,10.5vw,96px);   /* the cover, once */

  /* Two trackings out, one in. Nothing is tracked to its own private value. */
  --track-mark:.16em;                   /* uppercase labels and marks */
  --track-ui:.08em;                     /* uppercase controls */
  --track-tight:-.018em;                /* the serif at display sizes */

  /* The book is dark first. It is read in a basement with a projector on and
     the lights off, so that is the design, not an alternative skin. Paper is
     the switched state, under Filter and sort, and it is what prints. */
  --paper:#0E120F;
  --panel:#151A15;
  --card:#151B16;
  --ink:#E8E4D7;
  --ink-soft:#9AA69A;
  --rule:#2B332B;
  --rule-soft:#222A23;
  /* the masthead has to read as a plate against near-black paper, so the
     green sits well above the page rather than a shade off it */
  --band:#163326;
  --band-ink:#EFEADC;
  --band-soft:#A2B5A6;
  --brass:#D4B274;
  --brass-bright:#E3C68F;
  --sel-bg:#D4B274;
  --sel-ink:#121712;
  --motif:rgba(212,178,116,.13);
  --lift:0 1px 2px rgba(0,0,0,.6),0 16px 36px -16px rgba(0,0,0,.85);
  --plate-a:#1A2F24;
  --plate-b:#0C1611;
  /* the apparatus sits on its own surface, a shade off the paper */
  --bar-bg:#191F1A;
  --scrim:rgba(0,0,0,.66);
  --bar-h:108px;
  color-scheme:dark;
}
/* Paper. A viewer who asks for it gets it, and a viewer whose device asks for
   it gets it too -- unless they have said dark, which the script sets on load
   so the book opens dark whatever the device thinks. */
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --paper:#F7F4ED;
  --panel:#EBE6D9;
  --card:#FDFCF8;
  --ink:#14251B;
  --ink-soft:#56665A;
  --rule:#D4CCBA;
  --rule-soft:#E2DACA;
  --band:#17382A;
  --band-ink:#EEEADD;
  --band-soft:#A9BCAE;
  --brass:#7E5E22;
  --brass-bright:#9A7533;
  --sel-bg:#17382A;
  --sel-ink:#F3EFE3;
  --motif:rgba(201,164,94,.15);
  --lift:0 1px 2px rgba(20,37,27,.05),0 10px 28px -12px rgba(20,37,27,.26);
  --plate-a:#1C3728;
  --plate-b:#102017;
  --bar-bg:#FAF8F2;
  --scrim:rgba(20,37,27,.42);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --paper:#F7F4ED;
  --panel:#EBE6D9;
  --card:#FDFCF8;
  --ink:#14251B;
  --ink-soft:#56665A;
  --rule:#D4CCBA;
  --rule-soft:#E2DACA;
  --band:#17382A;
  --band-ink:#EEEADD;
  --band-soft:#A9BCAE;
  --brass:#7E5E22;
  --brass-bright:#9A7533;
  --sel-bg:#17382A;
  --sel-ink:#F3EFE3;
  --motif:rgba(201,164,94,.15);
  --lift:0 1px 2px rgba(20,37,27,.05),0 10px 28px -12px rgba(20,37,27,.26);
  --plate-a:#1C3728;
  --plate-b:#102017;
  --bar-bg:#FAF8F2;
  --scrim:rgba(20,37,27,.42);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 22px);-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs-prose);line-height:1.5}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--brass-bright);outline-offset:3px}

.sheet{max-width:1180px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- cover plate ---------- */
.cover{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink)}
.cover::before{content:"";position:absolute;inset:-40% -12% -40% 30%;pointer-events:none;
  background:repeating-radial-gradient(ellipse 62% 40% at 72% 52%,var(--motif) 0 1px,transparent 1px 21px)}
.cover-in{position:relative;padding-block:clamp(34px,6.2vw,74px)}
.runhead{display:flex;justify-content:space-between;gap:16px;
  font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--band-soft)}
.cover h1{font-family:var(--serif);font-weight:400;font-size:var(--fs-cover);
  line-height:.95;letter-spacing:var(--track-tight);margin-block:clamp(16px,3.4vw,30px) 0}
.hair{height:1px;background:var(--brass-bright);opacity:.75;margin-block:clamp(18px,3vw,26px) 0;border:0}
.dek{font-family:var(--serif);font-size:var(--fs-entry);line-height:1.45;max-width:30ch;
  color:var(--band-ink);margin-top:clamp(16px,2.6vw,22px)}
.dek em{font-style:italic;color:var(--brass-bright)}

/* On screen the cover is a masthead: the book's name and where it is kept,
   one band deep, scrolling away above the bar. The contents is reachable from
   anywhere now, so neither a full plate nor a standing contents page earns a
   screen of its own, and a reader meets a photograph first. Both are kept for
   print, where nothing is tappable and a reader does want a front page and a
   list -- so these are the screen's rules only, and the sheet is untouched. */
@media screen{
  .cover-in{padding-block:11px 14px}
  .cover::before{inset:-220% -12% -220% 34%}
  .cover h1{font-size:var(--fs-entry);line-height:1.12;margin-block:4px 0}
  .cover .hair,.cover .dek{display:none}
  .contents-wrap{display:none}
}

/* ---------- sticky bar ---------- */
/* Idle, the bar is one field and a count. Everything that used to crowd it
   -- two labelled chip rows -- now lives in the panel, and only what is
   actually switched on comes back out onto the rail below the field. */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bar-bg);border-bottom:1px solid var(--rule);
  transition:box-shadow .2s}
/* once it is pinned it casts a shadow, so cards read as passing *under* it */
.bar.stuck{box-shadow:0 14px 24px -20px rgba(20,37,27,.75)}
.bar-in{padding-block:11px 14px;display:grid;gap:11px}
.bar-top{display:flex;align-items:center;gap:10px;min-width:0}
.search{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;height:46px;
  border-bottom:1px solid var(--rule)}
.search svg{flex:none;width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:1.7;
  stroke-linecap:round}
.search input{flex:1 1 auto;min-width:0;width:100%;height:44px;border:0;background:transparent;
  color:var(--ink);font:400 var(--fs-prose)/1 var(--sans)}
.search input::placeholder{color:var(--ink-soft);opacity:.85}
.search input:focus{outline:0}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search:focus-within{border-bottom-color:var(--brass-bright)}
.search-x{flex:none;width:36px;height:36px;margin-right:-8px;border:0;border-radius:999px;
  background:transparent;color:var(--ink-soft);font:400 19px/1 var(--sans);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.search-x[hidden]{display:none}

/* the one way in to filtering and sorting */
.tune{flex:none;display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 16px;
  border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;
  white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tune svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round}
.tune b{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;
  padding:0 6px;border-radius:999px;background:var(--sel-bg);color:var(--sel-ink);
  font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.tune b[hidden]{display:none}
.tune[aria-expanded="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.tune[aria-expanded="true"] b{background:var(--sel-ink);color:var(--sel-bg)}
@media (max-width:539px){.tune .long{display:none}}

/* the rail: the count, then one removable token per thing that is switched on.
   It wraps, so nothing is ever hidden off the right-hand edge. */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.status{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;
  color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:2px}
.status b{font-weight:500;color:var(--ink)}
.status .of{opacity:.7}
.tok{display:inline-flex;align-items:center;gap:8px;min-height:40px;max-width:100%;
  padding:0 7px 0 13px;border:1px solid var(--sel-bg);border-radius:999px;
  background:var(--sel-bg);color:var(--sel-ink);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;
  white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tok em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tok i{flex:none;font-style:normal;display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:999px;font-size:14px;line-height:1;
  background:rgba(255,255,255,.17)}
/* a sort is not a filter: dashed edge, paper ground, so the two never read alike */
.tok-sort{background:transparent;border-style:dashed;border-color:var(--brass);color:var(--brass)}
.tok-sort i{background:transparent;border:1px solid var(--brass);width:22px;height:22px}
.tok[hidden]{display:none}
/* the rail never grows past two rows: the rest folds into one button */
.tok-more{background:transparent;border-style:dashed;border-color:var(--rule);color:var(--ink-soft);
  padding:0 14px}
.rail-clear{min-height:40px;padding:0 4px;border:0;background:transparent;color:var(--ink-soft);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;
  text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.rail-clear[hidden]{display:none}

/* ---------- the filter and sort panel ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);
  opacity:0;visibility:hidden;transition:opacity .24s,visibility 0s .24s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .24s}
.panel{position:fixed;z-index:41;display:flex;flex-direction:column;max-width:100%;
  background:var(--card);color:var(--ink);
  visibility:hidden;transition:transform .26s cubic-bezier(.22,.61,.36,1),visibility 0s .26s}
.panel.open{visibility:visible;transition:transform .26s cubic-bezier(.22,.61,.36,1),visibility 0s}
/* wide: a drawer down the right edge, where a hand holding an iPad already is */
@media (min-width:700px){
  .panel{top:0;right:0;bottom:0;width:min(432px,100%);border-left:1px solid var(--rule);
    transform:translateX(102%)}
  .panel.open{transform:none}
}
/* narrow: a sheet up from the bottom, thumb first */
@media (max-width:699px){
  .panel{left:0;right:0;bottom:0;max-height:86vh;max-height:86dvh;
    border-top:1px solid var(--rule);border-radius:16px 16px 0 0;transform:translateY(102%)}
  .panel.open{transform:none}
  .panel-head::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;
    margin-left:-19px;border-radius:999px;background:var(--rule)}
}
.panel-head{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:17px 18px 14px;border-bottom:1px solid var(--rule)}
.panel-head h2{font-family:var(--serif);font-size:var(--fs-entry);letter-spacing:var(--track-tight)}
.panel-x{flex:none;width:44px;height:44px;margin-right:-10px;border:0;border-radius:999px;
  background:transparent;color:var(--ink-soft);font:400 23px/1 var(--sans);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:0 18px}
.block{padding-block:19px}
.block+.block{border-top:1px solid var(--rule-soft)}
.block-order{border-top:1px solid var(--rule);padding-top:22px}
.block-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;
  font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--brass)}
/* "any of" says OR inside a facet; the rule between blocks says AND across them */
.block-h em{font-style:normal;color:var(--ink-soft)}
.block-note{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.4;margin-top:9px;max-width:46ch}
.conj{display:flex;align-items:center;gap:12px;margin:0}
.conj::before,.conj::after{content:"";flex:1 1 auto;height:1px;background:var(--brass);opacity:.35}
.conj span{flex:none;font-size:var(--fs-mark);letter-spacing:var(--track-mark);
  text-transform:uppercase;color:var(--brass)}
.conj+.block{border-top:0}

.opts{display:grid;gap:2px;margin-top:11px}
.opt{display:flex;align-items:flex-start;gap:13px;min-height:50px;padding:8px 6px 8px 2px;
  border-radius:8px;cursor:pointer}
.opt input,.switch input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.opt-m{flex:none;width:20px;height:20px;margin-top:2px;border:1px solid var(--rule);
  border-radius:999px;display:flex;align-items:center;justify-content:center}
.opt-m::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--sel-bg);
  transform:scale(0);transition:transform .14s}
.opt input:checked+.opt-m{border-color:var(--sel-bg);border-width:2px}
.opt input:checked+.opt-m::after{transform:scale(1)}
.opt input:focus-visible+.opt-m{outline:2px solid var(--brass-bright);outline-offset:3px}
.opt-t{min-width:0;font:500 var(--fs-ui)/1.2 var(--sans);letter-spacing:var(--track-ui);
  text-transform:uppercase;color:var(--ink)}
.opt-t i{display:block;margin-top:5px;font:400 var(--fs-ui)/1.35 var(--sans);letter-spacing:0;
  text-transform:none;color:var(--ink-soft)}

.switch{display:flex;align-items:flex-start;gap:13px;min-height:50px;margin-top:11px;
  padding:13px 6px 8px 2px;border-top:1px solid var(--rule-soft);cursor:pointer}
.switch-box{flex:none;width:20px;height:20px;margin-top:2px;border:1px solid var(--rule);
  border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--sel-ink)}
.switch-box::after{content:"\2713";font:500 13px/1 var(--sans);opacity:0}
.switch input:checked+.switch-box{background:var(--sel-bg);border-color:var(--sel-bg)}
.switch input:checked+.switch-box::after{opacity:1}
.switch input:focus-visible+.switch-box{outline:2px solid var(--brass-bright);outline-offset:3px}

/* chips wrap inside the panel, so nothing scrolls out of sight sideways */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;
  border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;
  white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* the count rides on the chip's own size, set apart by weight and opacity, not by a face */
.chip i{font-style:normal;font-weight:400;opacity:.65;font-variant-numeric:tabular-nums}
/* on = a tick, a fill and a heavier edge. Three signals, so it survives dark
   mode and anyone who cannot tell the two colours apart. */
.chip::before{content:"\2713";width:0;overflow:hidden;font-size:12px;opacity:0;
  transition:width .14s,opacity .14s}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink);
  box-shadow:inset 0 0 0 1px var(--sel-bg)}
.chip[aria-pressed="true"]::before{width:14px;opacity:1}
.chip[aria-pressed="true"] i{opacity:.8}
/* a chip that would return nothing says so before it is pressed */
.chip[aria-disabled="true"]{opacity:.38;border-style:dashed;cursor:default}

.panel-foot{flex:none;display:flex;align-items:center;gap:10px;background:var(--card);
  padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.ghost{flex:none;min-height:46px;padding:0 10px;border:0;background:transparent;color:var(--ink-soft);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;
  text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ghost[hidden]{display:none}
.solid{flex:1 1 auto;min-height:46px;padding:0 18px;border:1px solid var(--sel-bg);border-radius:999px;
  background:var(--sel-bg);color:var(--sel-ink);font:500 var(--fs-ui)/1 var(--sans);
  letter-spacing:var(--track-ui);text-transform:uppercase;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.solid.none{background:transparent;color:var(--ink-soft);border-color:var(--rule);border-style:dashed}

/* ---------- contents ---------- */
.contents-wrap{background:var(--panel);border-bottom:1px solid var(--rule)}
.contents-in{padding-block:clamp(26px,4.4vw,48px)}
.kicker{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--brass)}
.toc{list-style:none;margin:14px 0 0;padding:0;columns:2;column-gap:clamp(28px,5vw,64px)}
@media (max-width:719px){.toc{columns:1}}
.toc li{break-inside:avoid}
.toc a{display:flex;align-items:baseline;gap:8px;min-height:50px;padding-block:6px;
  text-decoration:none;border-bottom:1px solid var(--rule-soft)}
.toc-name{font-family:var(--serif);font-size:var(--fs-entry);line-height:1.25;letter-spacing:var(--track-tight)}
.leader{flex:1 1 auto;min-width:14px;align-self:flex-end;margin-bottom:.42em;
  border-bottom:1px dotted var(--rule)}
.toc-n{flex:none;font-size:var(--fs-ui);color:var(--brass);
  font-variant-numeric:tabular-nums}
.toc a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.toc-note{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.45;max-width:60ch;margin-top:18px}
.toc-note[hidden]{display:none}

/* ---------- group openers ---------- */
.group{margin-top:clamp(40px,6vw,76px)}
.opener{border-top:2px solid var(--ink);padding-top:12px;
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.opener h2{font-family:var(--serif);font-size:var(--fs-opener);line-height:1.08;letter-spacing:var(--track-tight)}
.opener-n{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;
  color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
.gloss{font-family:var(--serif);font-size:var(--fs-prose);line-height:1.45;
  color:var(--ink-soft);max-width:58ch;margin-top:9px}

/* ---------- card grid ---------- */
/* align-items defaults to stretch: every card in a row is the same height. */
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));
  gap:clamp(20px,2.6vw,34px);margin-top:clamp(20px,2.8vw,32px)}

.course{display:flex;flex-direction:column;height:100%;background:var(--card);
  border:1px solid var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.shot{position:relative;flex:0 0 auto;aspect-ratio:800/450;max-width:100%;overflow:hidden;background:var(--plate-b)}
.shot img{width:100%;height:100%;object-fit:cover}
.plate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;background:linear-gradient(165deg,var(--plate-a),var(--plate-b))}
.plate::before{content:"";position:absolute;inset:0;
  background:repeating-radial-gradient(ellipse 48% 58% at 50% 56%,rgba(201,164,94,.17) 0 1px,transparent 1px 15px)}
.plate b{position:relative;font-family:var(--serif);font-weight:400;font-size:var(--fs-opener);
  line-height:1;letter-spacing:var(--track-ui);color:rgba(214,182,123,.82)}
.plate span{position:relative;font-size:var(--fs-mark);letter-spacing:var(--track-mark);
  text-transform:uppercase;color:rgba(214,182,123,.5)}

/* caption takes the remaining height, so the footer pins to the bottom of every card */
.caption{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;padding:16px 17px 18px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cname{font-family:var(--serif);font-size:var(--fs-entry);line-height:1.14;letter-spacing:var(--track-tight)}
.tags{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:4px}
.tag{font-size:var(--fs-mark);letter-spacing:var(--track-mark);
  text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);
  border-radius:999px;padding:4px 8px;white-space:nowrap}
/* only the tag you actually filtered on lights up, not every tag on every card */
.tag.on{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.tag-origin.on{color:var(--brass);font-weight:500}
/* a mark GSPro itself put on the course, not something we decided */
.tag-mark{color:var(--brass);border-color:var(--brass-soft,var(--rule))}

/* origin is context, not a headline: no rule round it, and the soft ink. It
   was dimmed on top of that, which did not clear 4.5:1 in either palette --
   the rule round the character mark is what tells the two apart. */
.tag-origin{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap;padding-right:1px}

/* par and yardage: the line a golfer reads first */
/* the figures that line up down a column of cards: tabular, so they do line up */
.scard{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 2px;
  font-size:var(--fs-ui);line-height:1.3;color:var(--ink);font-variant-numeric:tabular-nums}
.scard .par{color:var(--brass);font-weight:500}
.scard .tee{color:var(--ink-soft)}
.scard .tees,.scard .slope{color:var(--ink-soft)}
/* two tees or fewer is the thing to notice, so it is the only one that is not grey */
.scard .tees.few{color:var(--brass)}
.meta{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.35}
.meta .sep,.scard .sep{opacity:.5;padding-inline:5px}

.plays{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 9px;
  border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding-block:9px}
.plays-label{flex:none;font-size:var(--fs-mark);letter-spacing:var(--track-mark);
  text-transform:uppercase;color:var(--brass)}
.seg{font-size:var(--fs-ui);color:var(--ink);line-height:1.3;font-variant-numeric:tabular-nums}
.seg+.seg{border-left:1px solid var(--rule);padding-left:9px}
.seg-stimp{color:var(--brass);font-weight:500;font-variant-numeric:tabular-nums}

.note{font-family:var(--serif);font-size:var(--fs-prose);line-height:1.5;max-width:62ch}
.note b{font-weight:600}
.foot{display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:4px}
.alias,.by{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.35;min-width:0;overflow-wrap:anywhere}
.alias b{font-weight:500;color:var(--brass)}

/* a ruled break inside a rack: the five above it play as proper golf */
.turn{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-block:2px}
.turn::before,.turn::after{content:"";flex:1 1 auto;height:1px;background:var(--brass);opacity:.4}
.turn span{flex:0 1 auto;min-width:0;font-size:var(--fs-mark);letter-spacing:var(--track-mark);
  line-height:1.5;text-transform:uppercase;color:var(--brass);text-align:center}
@media (max-width:539px){.turn::before,.turn::after{flex:0 0 14px}}
.turn[hidden]{display:none}

/* lead plate: first entry in each section, given the full measure */
.course.lead{grid-column:1/-1;border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--lift);height:auto}
@media (min-width:760px){
  .course.lead{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);align-items:stretch}
  .course.lead .shot{aspect-ratio:auto;height:100%;min-height:330px}
  .course.lead .caption{gap:11px;padding:clamp(20px,2.4vw,30px)}
  .course.lead .cname{font-size:var(--fs-feature)}
}
/* A rack is 1, 2 or 3 columns wide depending on the viewport, so no fixed
   number of courses can divide evenly at every width. Instead, whenever the
   packing would leave a single card alone on a row, that card is given the
   full measure -- which reads as a deliberate wide entry rather than a gap.
   Worked out in script on every layout, filter and sort. */
.course.solo{grid-column:1/-1}
@media (min-width:760px){
  .course.solo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
  .course.solo .shot{aspect-ratio:auto;height:100%;min-height:248px}
  .course.solo .caption{padding:18px 20px 20px}
}
/* must come after the display rules above, or a filtered-out card still shows */
.course[hidden],.course.lead[hidden],.course.solo[hidden]{display:none}

/* ---------- the card at phone width ---------- */
/* The same width the bar already folds at. Below it the measure is too narrow
   for the wide arrangement -- the name beside a stacked column of marks, the
   plays line as a label and divided segments that wrap into a second line with
   a divider stranded at the head of it. So the card is set again, not squeezed. */
@media (max-width:539px){
  /* the two marks become an eyebrow above the name, which takes the measure */
  .head{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .tags{order:-1;flex-direction:row;flex-wrap:wrap;align-items:center;
    justify-content:flex-start;gap:0 8px;margin:0 0 7px}
  /* no boxes in an eyebrow: the character is the brass mark, the origin the
     quiet one. The box comes back only on the mark you actually filtered on. */
  .tag{border-color:transparent;padding:0;color:var(--brass)}
  .tag.on{padding:3px 9px}
  .tag+.tag-origin::before{content:"\00B7";padding-right:8px;opacity:.5}

  /* the caption is spaced by hand: the card line sits up against the name,
     the measurements and the note are set apart. One even gap between six
     unlike things is what made it read as a list of leftovers. */
  .caption{gap:0;padding:15px 16px 17px}
  .scard{font-size:var(--fs-prose);line-height:1.25}
  .meta{margin-top:5px}
  .plays{margin-top:13px}
  .note{margin-top:13px}
  .foot{gap:4px;padding-top:13px}

  /* Plays like: the label takes a column of its own and the segments stack
     beside it. Nothing wraps, so no divider can land at the head of a line.
     One segment reads as a single line, three as a short specification. */
  .plays{display:grid;grid-template-columns:auto minmax(0,1fr);
    column-gap:13px;row-gap:4px;align-items:baseline}
  .plays-label{grid-column:1;grid-row:1}
  .seg{grid-column:2}
  .seg+.seg{border-left:0;padding-left:0}
}

@media (hover:hover){
  .toc a:hover .toc-name{color:var(--brass)}
  .nav-list button:not([disabled]):hover .nav-name{color:var(--brass)}
  .chip:hover{border-color:var(--ink-soft)}
  .chip[aria-pressed="true"]:hover{color:var(--sel-ink)}
  .chip[aria-disabled="true"]:hover{border-color:var(--rule)}
  .opt:hover,.switch:hover{background:var(--panel)}
  .tok:hover i{background:rgba(255,255,255,.3)}
  .tok-sort:hover i{background:var(--motif)}
  .tune:hover{border-color:var(--brass)}
  .tune[aria-expanded="true"]:hover{border-color:var(--sel-bg)}
}

/* ---------- empty state ---------- */
.void{margin-top:clamp(34px,5vw,56px);border:1px solid var(--rule);border-radius:2px;
  background:var(--card);padding:clamp(28px,4vw,46px) clamp(20px,4vw,44px);
  text-align:center;display:grid;gap:13px;justify-items:center}
.void[hidden]{display:none}
.void-mark{font-family:var(--serif);font-size:var(--fs-opener);line-height:1;color:var(--brass);opacity:.5}
.void p{font-family:var(--serif);font-size:var(--fs-entry);line-height:1.3;max-width:34ch}
.void small{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.45;max-width:44ch}
.void-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.void button{min-height:46px;padding:0 20px;border:1px solid var(--rule);border-radius:999px;
  background:transparent;color:var(--ink);font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);
  text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}
.void button.solid{flex:none;border-color:var(--sel-bg);background:var(--sel-bg);color:var(--sel-ink)}

/* ---------- the contents, kept within reach ---------- */
/* On paper the contents is a page at the front of the book. On screen it is
   this: a mark that stands on every scroll, names the section you are in, and
   opens the list on a tap. It is the mark that was already there, and the list
   opens in the panel's own drawer-or-sheet, so nothing new was added. */
.jump{position:fixed;z-index:30;
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  display:inline-flex;align-items:center;gap:9px;
  min-height:48px;padding:0 19px;border:0;border-radius:999px;
  background:var(--sel-bg);color:var(--sel-ink);box-shadow:0 8px 24px -8px rgba(0,0,0,.45);
  font:500 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:opacity .22s,transform .22s}
.jump svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.jump em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* it stands down only while the sheet it opens is over the page */
body.held .jump{opacity:0;transform:translateY(10px);pointer-events:none}

/* the list inside the sheet: the contents page again, one column, and the
   section you are reading marked where you would look for it */
.panel-nav .panel-body{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.nav-list{list-style:none;margin:0;padding:0}
.nav-list li[hidden]{display:none}
.nav-list button{display:flex;width:100%;align-items:baseline;gap:12px;min-height:54px;
  padding:8px 0;border:0;border-bottom:1px solid var(--rule-soft);background:transparent;
  color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:999px;background:transparent;
  margin-right:.46em;vertical-align:.14em}
.nav-name{font-family:var(--serif);font-size:var(--fs-entry);line-height:1.22;
  letter-spacing:var(--track-tight);min-width:0}
.nav-n{flex:none;font-size:var(--fs-ui);color:var(--brass);font-variant-numeric:tabular-nums}
.nav-list button[disabled]{opacity:.35;cursor:default}
.nav-list button[aria-current="true"] .nav-dot{background:var(--brass)}
.nav-list button[aria-current="true"] .nav-name{color:var(--brass)}
.nav-note{font-size:var(--fs-ui);color:var(--ink-soft);line-height:1.45;padding-block:16px 4px}

/* ---------- colophon ---------- */
.colophon{margin-top:clamp(48px,7vw,88px);border-top:1px solid var(--rule)}
.colophon-in{padding-block:22px calc(34px + env(safe-area-inset-bottom,0px));display:flex;
  flex-wrap:wrap;gap:6px 18px;justify-content:space-between;
  font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;
    transition-delay:0s!important;animation-delay:0s!important}
}

/* ---------- print: A4, light palette forced, photographs kept ---------- */
@media print{
  @page{size:A4;margin:14mm 13mm}
  /* Force the light tokens whatever the screen was set to, and keep the ink.
     Every selector the screen's two palettes can match is named here, and
     this block is last, so it wins each of them on its own terms. */
  :root,:root[data-theme="light"],:root[data-theme="dark"],:root:not([data-theme="dark"]){
    --paper:#FFFFFF;
    --panel:#F2EEE3;
    --card:#FFFFFF;
    --ink:#14251B;
    --ink-soft:#4E5E53;
    --rule:#C8C0AE;
    --rule-soft:#DED6C5;
    --band:#17382A;
    --band-ink:#F2EFE4;
    --band-soft:#C3D0C5;
    --brass:#6F5119;
    --brass-bright:#9A7533;
    --motif:rgba(201,164,94,.22);
    --lift:none;
    --bar-bg:#FFFFFF;
    --plate-a:#1C3728;
    --plate-b:#102017;
    --bar-h:0px;
    color-scheme:light;
    /* the one scale again, in points, so every rule above follows without being restated */
    --fs-mark:7.5pt;
    --fs-ui:8.5pt;
    --fs-prose:10pt;
    --fs-entry:14pt;
    --fs-feature:17pt;
    --fs-opener:21pt;
    --fs-cover:46pt;
  }
  *,*::before,*::after{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    box-shadow:none!important;transition:none!important}
  html{scroll-padding-top:0}
  body{background:#fff;font-size:var(--fs-prose);line-height:1.42}

  /* the apparatus of a web page goes away; the book stays */
  .bar,.jump,.void,.turn,.scrim,.panel{display:none!important}

  .sheet{max-width:none;margin-inline:0;padding-inline:0}
  /* the cover and contents are tinted blocks: they keep an inner gutter */
  .cover-in,.contents-in{padding-inline:11mm}
  .cover{break-after:page}
  .cover-in{padding-block:22mm 18mm}
  .dek{max-width:32ch}
  .contents-wrap{border-bottom:0;break-after:page}
  .contents-in{padding-block:11mm}
  .toc a{min-height:0;padding-block:3pt}

  .group{margin-top:10mm;break-before:auto}
  .group:first-child{margin-top:0}
  .opener{break-after:avoid;break-inside:avoid;padding-top:5pt}
  .gloss{break-after:avoid;margin-top:4pt}
  .rack{grid-template-columns:repeat(2,minmax(0,1fr));gap:7mm;margin-top:6mm}

  .course{break-inside:avoid;page-break-inside:avoid;height:auto;
    border:1px solid var(--rule);background:#fff}
  .shot{break-inside:avoid}
  .shot img{max-width:100%}
  .caption{padding:9pt 10pt 10pt;gap:6pt}
  .note{max-width:none}
  .foot{margin-top:8pt}

  /* the full-measure lead plate stays two-up but must not straddle a page */
  .course.lead{grid-column:1/-1;break-inside:avoid;border:1px solid var(--rule)}
  .course.lead .shot{min-height:0;aspect-ratio:800/450}

  /* The sheet is always two columns, whatever the screen was, so the screen's
     own lone-card promotion is undone and a separate one computed for print. */
  .course.solo{grid-column:auto;display:flex}
  .course.solo .shot{aspect-ratio:800/450;height:auto;min-height:0}
  .course[data-psolo]{grid-column:1/-1;display:grid;align-items:stretch;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .course[data-psolo] .shot{aspect-ratio:auto;height:100%;min-height:0}
  .course[data-psolo] .caption{padding:9pt 10pt 10pt}

  .colophon{margin-top:10mm;break-inside:avoid}
  .colophon-in{padding-block:6pt 0}
}

/* ---- course details: click a card ---- */
.course{cursor:pointer}
.course:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.more{margin-top:auto;font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--brass)}
dialog.cd{width:min(980px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--rule);
  border-radius:4px;background:var(--card);color:var(--ink);box-shadow:var(--lift);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
dialog.cd::backdrop{background:var(--scrim)}
.cd-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--bar-bg);border-bottom:1px solid var(--rule)}
.cd-top b{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.cd-x{font:600 var(--fs-ui)/1 var(--sans);letter-spacing:var(--track-ui);text-transform:uppercase;padding:9px 14px;
  border:1px solid var(--rule);border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
.cd-photo{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;background:var(--plate-b)}
.cd-body{padding:18px 20px 26px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.cd-body h2{font-family:var(--serif);font-weight:400;font-size:var(--fs-feature);line-height:1.1;letter-spacing:var(--track-tight);margin:0}
.cd-sub{margin:4px 0 0;color:var(--ink-soft);font-size:var(--fs-ui)}
.cd-desc{font-family:var(--serif);font-size:var(--fs-prose);margin:0;max-width:68ch}
.cd h3{margin:0 0 8px;font:600 var(--fs-mark)/1.3 var(--sans);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--brass)}
.cd-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;margin:0;background:var(--rule);border:1px solid var(--rule)}
.cd-facts div{background:var(--card);padding:10px 12px}
.cd-facts dt{font-size:var(--fs-mark);letter-spacing:var(--track-mark);text-transform:uppercase;color:var(--ink-soft)}
.cd-facts dd{margin:3px 0 0;font-size:var(--fs-prose)}
.cd-scroll{overflow-x:auto;border:1px solid var(--rule);max-width:100%}
.cd table{border-collapse:collapse;width:100%;font-size:var(--fs-ui);font-variant-numeric:tabular-nums}
.cd th,.cd td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule-soft)}
.cd th:first-child,.cd td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.cd thead th{font-weight:600;color:var(--ink-soft);font-size:var(--fs-mark);letter-spacing:var(--track-ui);text-transform:uppercase}
.cd td.sum,.cd th.sum{font-weight:700;background:var(--panel)}
.cd .chip-k{display:inline-block;margin:0 6px 6px 0;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;font-size:var(--fs-ui)}
.cd-card{display:block;width:100%;height:auto;border:1px solid var(--rule)}
.cd-note{font-size:var(--fs-ui);color:var(--ink-soft);margin:6px 0 0}
.tee-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px var(--ink-soft)}
@media (max-width:539px){dialog.cd{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}.cd-body{padding:14px 14px 22px}.cd-photo{aspect-ratio:16/10}}
@media print{dialog.cd,.more{display:none}}
</style>

<header class="cover">
  <div class="sheet cover-in">
    <p class="runhead"><span>GSPro library</span><span>New Delhi</span></p>
    <h1>The Course Book</h1>
    <hr class="hair">
    <p class="dek" id="dek"><em>Pick one.</em></p>
  </div>
</header>

<div class="bar" id="bar">
  <div class="sheet bar-in">
    <div class="bar-top">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Course, town or builder" aria-label="Search by course name, GSPro name, location or builder">
        <button class="search-x" id="search-x" type="button" hidden aria-label="Clear the search">&times;</button>
      </label>
      <button class="tune" id="tune" type="button" aria-expanded="false" aria-controls="panel" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h9M17 7h4M3 17h4M12 17h9"></path><circle cx="14.5" cy="7" r="2.4"></circle><circle cx="9.5" cy="17" r="2.4"></circle></svg>
        <span>Filter<span class="long"> &amp; sort</span></span><b id="tune-n" hidden></b>
      </button>
    </div>
    <div class="rail" id="rail">
      <p class="status" id="status" aria-live="polite" role="status"></p>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-h">
  <header class="panel-head">
    <h2 id="panel-h" tabindex="-1">Filter &amp; sort</h2>
    <button class="panel-x" id="panel-x" type="button" aria-label="Close filter and sort">&times;</button>
  </header>
  <div class="panel-body">
    <section class="block">
      <h3 class="block-h">Character <em>any of</em></h3>
      <div class="chips" id="chips-type" role="group" aria-label="Filter by playing character; any of these"></div>
      <p class="block-note" id="type-note" hidden></p>
    </section>
    <p class="conj"><span>and</span></p>
    <section class="block">
      <h3 class="block-h">Origin <em>any of</em></h3>
      <div class="chips" id="chips-origin" role="group" aria-label="Filter by origin; any of these"></div>
    </section>
    <section class="block block-order">
      <h3 class="block-h">Order <em>one of</em></h3>
      <div class="opts" id="sorts"></div>
      <label class="switch">
        <input type="checkbox" id="flat">
        <span class="switch-box" aria-hidden="true"></span>
        <span class="opt-t">One run<i id="flat-note">Set the sections aside and order the whole library together.</i></span>
      </label>
      <p class="block-note" id="sort-note" hidden></p>
    </section>
    <section class="block block-order">
      <h3 class="block-h">The page <em>one of</em></h3>
      <div class="opts" id="themes" role="radiogroup" aria-label="Light or dark page"></div>

","designer":"Strong Design Studio","yardage":"1,107","plays_like":"No wind · Normal fairways and greens · Stimp 10–13","note":"A private club “lost in time”, built 1874. The short half of the pair.","type":"Mountain","par":54,"origin":"Invented","marks":["Kind to beginners"]}];

const TYPE_ORDER = ["Links","Coastal","Parkland","Heathland","Mountain","Desert","Tropical"];
const ORIGIN_ORDER = ["Real course","Invented"];
const STOP = new Set(["the","at","of","and","&","no.","no","a"]);

// one line under each opener, so the book says what each section is for
const GLOSS = {
  "Championship courses":"Tour venues and the names everybody already knows. Most evenings, start here.",
  "Great courses":"Real ground, less famous, often the better golf.",
  "Fantasy courses":"Invented places, kept to one section so you only meet them when you come looking.",
  "Short courses":"Par 3s and nine-holers \u2014 an hour, not an afternoon.",
  "Pitch and putt courses":"Putters and wedges. The ones to hand a guest."
};
// a ruled break inside one rack, after the nth card of that group
const TURN = { "Fantasy courses":{ after:5, text:"Those five play as proper golf \u00b7 beyond here, for fun" } };

// every way the book can be put in order. "book" is the order the data gives,
// which is most-played first -- named here so it stops being an invisible default.
const SORTS = [
  { id:"book",  label:"Most played",        note:"The order the book is kept in." },
  { id:"name",  label:"Course name",        note:"A to Z." },
  { id:"long",  label:"Longest first",      note:"By the card off the back tees." },
  { id:"short", label:"Shortest first",     note:"By the card off the back tees." },
  { id:"par",   label:"Par, highest first", note:"" },
  { id:"by",    label:"Builder",            note:"A to Z, so one builder's work sits together." }
];

const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const slug = s => s.toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,"-");
const $ = id => document.getElementById(id);

// ---- light or dark ----
// Dark is the book's own state, so it is set on the root on load whatever the
// device prefers. A viewer who wants paper says so here and it is remembered.
// Storage throws in a private window and comes back empty after a clear, so
// every touch of it is guarded and the default stands on its own.
const THEMES = [
  { id:"dark",  label:"Dark",  note:"The default. For the room with the projector on." },
  { id:"light", label:"Light", note:"Paper, for a bright room. It is also what prints." }
];
const THEME_KEY = "coursebook-theme";
$("themes").innerHTML = THEMES.map(t =>
  '<label class="opt"><input type="radio" name="theme" value="' + t.id + '">' +
  '<span class="opt-m" aria-hidden="true"></span>' +
  '<span class="opt-t">' + esc(t.label) + "<i>" + esc(t.note) + "</i></span></label>").join("");
function setTheme(id, keep){
  document.documentElement.setAttribute("data-theme", id);
  for(const r of $("themes").querySelectorAll('input[name="theme"]')) r.checked = r.value === id;
  if(keep) try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
}
let kept = null;
try{ kept = localStorage.getItem(THEME_KEY); }catch(e){}
setTheme(kept === "light" || kept === "dark" ? kept : "dark", false);

function initials(name){
  const words = name.replace(/\(.*?\)/g,"").split(/\s+/)
    .map(w => w.replace(/[^A-Za-z0-9']/g,""))
    .filter(w => w && !STOP.has(w.toLowerCase()) && /[A-Za-z]/.test(w[0]));
  return (words.slice(0,2).map(w => w[0]).join("") || name[0] || "?").toUpperCase();
}

// "7,239" -> 7,239 yd; "7,239 (Black)" -> 7,239 yd (Black); "18 holes" -> as written
function yardageHTML(v){
  if(!v) return "";
  const m = String(v).match(/^([\d,]+)\s*(\(.+\))?$/);
  if(!m) return '<span class="yd">' + esc(v) + "</span>";
  return '<span class="yd">' + esc(m[1]) + " yd</span>" +
    (m[2] ? '<span class="tee">&nbsp;' + esc(m[2]) + "</span>" : "");
}

// a length to sort on. "18 holes" counts holes, not yards, so it has none.
function lengthOf(v){
  const t = String(v == null ? "" : v).replace(/,/g,"");
  if(/hole/i.test(t)) return null;
  const m = t.match(/^\s*(\d+)/);
  return m ? +m[1] : null;
}

// the card line: par first, then the measure, then how far it can come down
function scorecard(c){
  const bits = [];
  if(c.par != null && c.par !== "") bits.push('<span class="par">Par ' + esc(c.par) + "</span>");
  if(c.yardage) bits.push(yardageHTML(c.yardage));
  // Tee count is the number that decides whether a course suits a mixed group.
  // Two tees cannot be made short enough for a beginner; eight suits anybody.
  // Flagged at two or fewer, because that is the case you want to see coming.
  if(c.tees) bits.push('<span class="tees' + (c.tees <= 2 ? " few" : "") + '">' +
    esc(c.tees) + (c.tees === 1 ? " tee" : " tees") + "</span>");
  if(c.slope) bits.push('<span class="slope">Slope ' + esc(c.slope) + "</span>");
  return bits.length ? '<p class="scard">' + bits.join('<span class="sep">&middot;</span>') + "</p>" : "";
}

// ---- derived, once ----
COURSES.forEach((c,i) => {
  c.i = i;
  c._q   = norm([c.name,c.gspro,c.location,c.designer].join(" "));
  c._sn  = norm(c.name).replace(/^(the|a)\s+/,"");
  c._sb  = norm(c.designer || "");
  c._len = lengthOf(c.yardage);
  c._par = (c.par == null || c.par === "") ? null : +c.par;
});

// groups, in the order the data gives them
const GROUPS = [];
for(const c of COURSES) if(!GROUPS.includes(c.group)) GROUPS.push(c.group);

const count = fn => COURSES.reduce((n,c) => n + (fn(c) ? 1 : 0), 0);
const N_PHOTOS  = count(c => c.image);
const N_REAL    = count(c => c.origin === "Real course");
const N_NOTYPE  = count(c => !c.type);
const N_NOLEN   = count(c => c._len == null);
const N_NOPAR   = count(c => c._par == null);

const present = (order, get) => order.filter(v => COURSES.some(c => get(c) === v));
// two facets. They combine with AND; the values inside one combine with OR.
const FACETS = [
  { key:"type",   name:"Character", el:"chips-type",   get:c => c.type,
    values:present(TYPE_ORDER, c => c.type) },
  { key:"origin", name:"Origin",    el:"chips-origin", get:c => c.origin,
    values:present(ORIGIN_ORDER, c => c.origin) }
];

$("colophon-count").textContent =
  COURSES.length + " entries \u00b7 " + N_PHOTOS + " photographs";
$("dek").innerHTML =
  COURSES.length + " courses are downstairs, " + N_REAL +
  " of them real. <em>Pick one.</em>";

// ---- contents page ----
$("toc").innerHTML = GROUPS.map(g => {
  const n = COURSES.filter(c => c.group === g).length;
  return '<li><a href="#' + slug(g) + '" data-group="' + esc(g) + '">' +
    '<span class="toc-name">' + esc(g) + "</span>" +
    '<span class="leader"></span>' +
    '<span class="toc-n">' + n + "</span></a></li>";
}).join("");
// the one thing on a card that a reader cannot work out for themselves
const TOC_FOOT = "Yardages are the card off the back tees, where the builder published one.";
const TOC_FLAT = "Sections are set aside while the library is ordered as one run.";

// ---- the same contents, inside the sheet ----
// The page above is built for print, where it is a list and stays a list.
// This is the screen's copy: one column, every row a jump, the row you are
// in marked, and reachable from anywhere instead of only from the top.
function navRow(to, label, group){
  return '<li><button type="button" data-to="' + esc(to) + '"' +
    (group ? ' data-group="' + esc(group) + '"' : "") + ">" +
    '<span class="nav-name"><i class="nav-dot" aria-hidden="true"></i>' + esc(label) + "</span>" +
    '<span class="leader"></span>' +
    (group || to === "all-courses" ? '<span class="nav-n"></span>' : "") +
    "</button></li>";
}
$("nav-list").innerHTML =
  GROUPS.map(g => navRow(slug(g), g, g)).join("") +
  navRow("all-courses", "The whole library");

// ---- the panel: order, then the facets ----
$("sorts").innerHTML = SORTS.map(o =>
  '<label class="opt"><input type="radio" name="sort" value="' + o.id + '"' +
  (o.id === "book" ? " checked" : "") + ">" +
  '<span class="opt-m" aria-hidden="true"></span>' +
  '<span class="opt-t">' + esc(o.label) + (o.note ? "<i>" + esc(o.note) + "</i>" : "") +
  "</span></label>").join("");

for(const f of FACETS){
  $(f.el).innerHTML = f.values.map(v =>
    '<button class="chip" type="button" data-facet="' + f.key + '" data-value="' + esc(v) + '" ' +
    'aria-pressed="false"><span>' + esc(v) + "</span><i></i></button>").join("");
  f.chips = Array.from($(f.el).querySelectorAll(".chip"));
}
if(N_NOTYPE){
  $("type-note").hidden = false;
  $("type-note").textContent = N_NOTYPE + (N_NOTYPE === 1 ? " course has" : " courses have") +
    " no character recorded yet, so they answer to none of these.";
}

// ---- cards ----
let shown = 0;
function card(c){
  const shot = '<div class="shot">' + (c.image
    ? '<img src="' + esc(c.image) + '" alt="' + esc(c.name) + '" width="800" height="450" ' +
      (shown++ < 3 ? 'decoding="async"' : 'loading="lazy" decoding="async"') + ">"
    : plateHTML(c)) + "</div>";

  const tags = [];
  if(c.type) tags.push('<span class="tag">' + esc(c.type) + "</span>");
  // GSPro's own keywords: the designer said this is a major venue or a tour
  // stop, so it is worth showing. Major venue leads, being the strongest.
  (c.marks || []).forEach(m => {
    if(m !== "Kind to beginners")
      tags.push('<span class="tag tag-mark">' + esc(m) + "</span>");
  });
  if(c.origin) tags.push('<span class="tag-origin">' + esc(c.origin) + "</span>");

  const meta = c.location ? '<p class="meta">' + esc(c.location) + "</p>" : "";

  let plays = "";
  if(c.plays_like){
    const segs = c.plays_like.split("\u00b7").map(s => s.trim()).filter(Boolean)
      .map(s => '<span class="seg' + (/^stimp/i.test(s) ? " seg-stimp" : "") + '">' + esc(s) + "</span>").join("");
    plays = '<div class="plays"><span class="plays-label">Plays like</span>' + segs + "</div>";
  }

  const foot = [];
  // reads as a sentence where it sits, so the cover needs no key for it
  if(c.gspro && c.gspro !== c.name) foot.push('<span class="alias">Listed in GSPro as <b>' + esc(c.gspro) + "</b></span>");
  if(c.designer) foot.push('<span class="by">Built by ' + esc(c.designer) + "</span>");

  return '<article class="course" data-i="' + c.i + '" tabindex="0" role="button" aria-haspopup="dialog">' + shot +
    '<div class="caption">' +
      '<div class="head"><h3 class="cname">' + esc(c.name) + "</h3>" +
        (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") + "</div>" +
      scorecard(c) + meta + plays +
      (c.note ? '<p class="note">' + c.note + "</p>" : "") +
      (foot.length ? '<footer class="foot">' + foot.join("") + "</footer>" : "") +
      '<span class="more">Tees, card and conditions &rarr;</span>' +
    "</div></article>";
}

function plateHTML(c){
  return '<div class="plate" role="img" aria-label="No photograph of ' + esc(c.name) + '">' +
    "<b>" + esc(initials(c.name)) + "</b><span>No photograph</span></div>";
}

$("groups").innerHTML = GROUPS.map(g => {
  const list = COURSES.filter(c => c.group === g);
  const turn = TURN[g];
  let rack = "";
  list.forEach((c,i) => {
    rack += card(c);

      rack += '<p class="turn" data-turn><span>' + esc(turn.text) + "</span></p>";
  });
  return '<section class="group" id="' + slug(g) + '" data-group="' + esc(g) + '">' +
    '<header class="opener"><h2>' + esc(g) + "</h2>" +

    (GLOSS[g] ? '<p class="gloss">' + esc(GLOSS[g]) + "</p>" : "") +

}).join("") +
// the sections set aside: one rack that holds the whole library in one order
'<section class="group" id="all-courses" hidden>' +
  '<header class="opener"><h2>The whole library</h2>' +
  '<span class="opener-n" data-count></span></header>' +
  '<p class="gloss" id="all-gloss"></p><div class="rack" id="all-rack"></div></section>' +
'<div class="void" id="void" hidden>' +
  '<p class="void-mark">O.B.</p><p id="void-msg"></p><small id="void-sub"></small>' +
  '<div class="void-acts"><button type="button" id="void-open">Change the filters</button>' +
  '<button type="button" class="solid" id="void-clear">Clear all</button></div></div>';

// swap in the drawn plate if a photograph fails to load
document.querySelectorAll("#groups img").forEach(img => {
  img.addEventListener("error", () => {
    const c = COURSES[+img.closest(".course").dataset.i];
    img.outerHTML = plateHTML(c);
  }, { once:true });

// ---- the pieces, found once ----
const cards    = Array.from(document.querySelectorAll(".course"));
const tagsOf   = cards.map(el => ({ t:el.querySelector(".tag"), o:el.querySelector(".tag-origin") }));
const allSec   = $("all-courses");
const allRack  = $("all-rack");
const sections = Array.from(document.querySelectorAll(".group")).filter(s => s !== allSec);
const RACKS    = sections.map(sec => {
  const rack = sec.querySelector(".rack");
  return { sec, rack, nodes:Array.from(rack.children) };
});
const turns    = Array.from(document.querySelectorAll("[data-turn]"));
const tocLinks = Array.from(document.querySelectorAll("#toc a"));
const navBtns  = Array.from(document.querySelectorAll("#nav-list button"));
const chips    = Array.from(document.querySelectorAll(".chip"));
const input    = $("q");
const statusEl = $("status");
const railEl   = $("rail");
const voidEl   = $("void");
const bar      = $("bar");
const panel    = $("panel");
const nav      = $("nav");
const scrim    = $("scrim");
const tune     = $("tune");
const jump     = $("jump");

// ---- state ----
const sel = { type:new Set(), origin:new Set() };
let query = "", sortId = "book", flat = false;

const nSel = () => FACETS.reduce((n,f) => n + sel[f.key].size, 0);

// AND across the facets, OR inside one. `skip` leaves one facet out, which is
// how each chip can show what it would come to against everything else.
function passes(c, q, skip){
  for(const f of FACETS){
    if(f.key === skip) continue;
    const set = sel[f.key];
    if(set.size && !set.has(f.get(c))) return false;
  }
  return !q || c._q.includes(q);
}

// ---- order ----
function byNum(a, b, k, desc){
  const x = a[k], y = b[k];
  if(x == null && y == null) return a.i - b.i;
  if(x == null) return 1;
  if(y == null) return -1;
  return x === y ? a.i - b.i : (desc ? y - x : x - y);
}
const txt = (x,y) => x < y ? -1 : x > y ? 1 : 0;
const CMP = {
  book:  (a,b) => a.i - b.i,
  name:  (a,b) => txt(a._sn, b._sn) || a.i - b.i,
  by:    (a,b) => txt(a._sb || "\uffff", b._sb || "\uffff") || txt(a._sn, b._sn),
  long:  (a,b) => byNum(a, b, "_len", true),
  short: (a,b) => byNum(a, b, "_len", false),
  par:   (a,b) => byNum(a, b, "_par", true)
};
const cof = el => COURSES[+el.dataset.i];

let orderKey = "";
function reorder(){
  const key = sortId + "|" + (flat ? 1 : 0);
  if(key === orderKey) return;
  orderKey = key;
  const cmp = (A,B) => CMP[sortId](cof(A), cof(B));
  if(flat){
    allRack.append.apply(allRack, cards.slice().sort(cmp));
  } else {
    for(const r of RACKS){
      if(sortId === "book"){ r.rack.append.apply(r.rack, r.nodes); continue; }
      const own = r.nodes.filter(n => n.classList.contains("course")).sort(cmp);
      const rest = r.nodes.filter(n => !n.classList.contains("course"));
      r.rack.append.apply(r.rack, rest.concat(own));
    }
  }
}

// ---- a card alone on a row takes the full measure ----
// The screen pass reads the live column count; the print pass is always two up,
// so the sheet never inherits whatever width the screen happened to be.
function pack(rack, cols, forPrint){
  let row = [];
  const flush = () => {
    if(row.length === 1){
      if(forPrint) row[0].setAttribute("data-psolo","");
      else row[0].classList.add("solo");
    }
    row = [];
  };
  for(const el of rack.children){
    if(el.hidden) continue;
    if(!el.classList.contains("course")){ if(!forPrint) flush(); continue; }
    if(el.classList.contains("lead")){ flush(); continue; }
    row.push(el);
    if(row.length === cols) row = [];
  }
  flush();
}
function tidyRows(){
  for(const el of cards){ el.classList.remove("solo"); el.removeAttribute("data-psolo"); }
  const racks = flat ? [allRack] : RACKS.map(r => r.rack);
  for(const rack of racks){
    const sec = rack.closest(".group");
    if(!sec || sec.hidden) continue;
    const cols = (getComputedStyle(rack).gridTemplateColumns.match(/px/g) || []).length || 1;
    pack(rack, cols, false);
    pack(rack, 2, true);
  }
}

// ---- the rail: one removable token per thing that is switched on ----
function tok(kind, value, label, cls){
  return '<button class="tok' + (cls ? " " + cls : "") + '" type="button" data-kind="' + kind +
    '" data-value="' + esc(value) + '" aria-label="Remove ' + esc(label) + '">' +
    "<em>" + esc(label) + "</em><i aria-hidden=\"true\">&times;</i></button>";
}
function drawRail(){
  while(railEl.children.length > 1) railEl.removeChild(railEl.lastChild);
  const bits = [];
  const q = query.trim();
  if(q) bits.push(tok("q", "", "\u201c" + q + "\u201d"));
  for(const f of FACETS)
    for(const v of f.values) if(sel[f.key].has(v)) bits.push(tok(f.key, v, v));
  if(sortId !== "book")
    bits.push(tok("sort", "", SORTS.find(o => o.id === sortId).label, "tok-sort"));
  if(flat) bits.push(tok("flat", "", "One run", "tok-sort"));
  if(bits.length){
    bits.push('<button class="tok tok-more" type="button" data-kind="more" hidden></button>');
    bits.push('<button class="rail-clear" type="button" id="rail-clear">Clear all</button>');
  }
  railEl.insertAdjacentHTML("beforeend", bits.join(""));
  trimRail();
}
// Two rows is as tall as the apparatus is allowed to get. Anything past that
// folds into a single button that opens the panel, so the bar cannot run away
// with the screen on a phone.
function trimRail(){
  const more = railEl.querySelector(".tok-more");
  if(!more) return;
  const toks = Array.from(railEl.querySelectorAll(".tok")).filter(t => t !== more);
  if(toks.length < 2) return;
  const max = (toks[0].offsetHeight + 9) * 2;
  let n = 0;
  while(railEl.offsetHeight > max && n < toks.length - 1){
    n++;
    toks[toks.length - n].hidden = true;
    more.hidden = false;
    more.innerHTML = "<em>" + n + " more</em>";
    more.setAttribute("aria-label", n + " more, open filter and sort");
  }
}

function apply(){
  const q = norm(query.trim());
  const picked = nSel();
  const active = picked > 0 || !!q;
  let total = 0;

  for(let i = 0; i < cards.length; i++){
    const el = cards[i], c = COURSES[+el.dataset.i], ok = passes(c, q, null);
    el.hidden = !ok;
    el.classList.remove("lead");
    if(ok) total++;
    const t = tagsOf[i];
    if(t.t) t.t.classList.toggle("on", sel.type.has(c.type));
    if(t.o) t.o.classList.toggle("on", sel.origin.has(c.origin));
  }

  // what each chip would come to, against everything else that is on
  for(const f of FACETS) for(const chip of f.chips){
    const v = chip.dataset.value;
    let n = 0;
    for(const c of COURSES) if(f.get(c) === v && passes(c, q, f.key)) n++;
    chip.querySelector("i").textContent = n;
    const on = sel[f.key].has(v);
    chip.setAttribute("aria-pressed", String(on));
    chip.setAttribute("aria-disabled", String(!on && n === 0));
  }

  reorder();

  allSec.hidden = true;
  for(const sec of sections) sec.hidden = flat || !dress(sec);
  if(flat) allSec.hidden = !dress(allSec);
  if(flat){
    const o = SORTS.find(x => x.id === sortId);
    $("all-gloss").textContent = "Every section together, " +
      (sortId === "book" ? "in the order the book is kept in." : o.label.toLowerCase() + ".");
  }

  // the break only reads correctly against the whole section, in its own order
  for(const t of turns) t.hidden = active || flat || sortId !== "book";

  const byGroup = {};
  for(const g of GROUPS) byGroup[g] = 0;
  for(const el of cards) if(!el.hidden) byGroup[cof(el).group]++;
  for(const a of tocLinks){
    const n = byGroup[a.dataset.group] || 0;
    a.querySelector(".toc-n").textContent = n;
    if(n === 0 || flat) a.setAttribute("aria-disabled","true"); else a.removeAttribute("aria-disabled");
  }
  $("toc-note").textContent = flat ? TOC_FLAT : TOC_FOOT;

  // the sheet's copy says the same thing, and drops the rows you cannot reach
  for(const b of navBtns){
    const g = b.dataset.group, isAll = b.dataset.to === "all-courses";
    const n = isAll ? total : (byGroup[g] || 0);
    b.querySelector(".nav-n").textContent = n;
    b.disabled = n === 0;
    b.closest("li").hidden = isAll ? !flat : flat;
  }
  $("nav-note").textContent = flat ? TOC_FLAT : TOC_FOOT;

  statusEl.innerHTML = active
    ? "<b>" + total + "</b> <span class=\"of\">of " + COURSES.length + "</span>"
    : "<b>" + COURSES.length + "</b> courses";
  drawRail();

  const badge = $("tune-n");
  badge.hidden = picked === 0;
  badge.textContent = picked;

  const note = $("sort-note");
  const miss = sortId === "par" ? N_NOPAR : (sortId === "long" || sortId === "short") ? N_NOLEN : 0;
  note.hidden = miss === 0;
  if(miss) note.textContent = miss + (miss === 1 ? " course has" : " courses have") +
    " no published " + (sortId === "par" ? "par" : "length") +
    "; they keep to the end, in the book's own order.";

  $("panel-clear").hidden = !active && sortId === "book" && !flat;
  const done = $("panel-done");
  done.classList.toggle("none", total === 0);
  done.textContent = total === 0 ? "Nothing matches"
    : active ? "Show " + total + (total === 1 ? " course" : " courses")
    : "Show all " + total;

  voidEl.hidden = total > 0;
  if(!total) dressVoid(q);
  tidyRows();
  // which section you are in has just moved under you. A frame late, because
  // the first apply runs before the measuring below it has been declared.
  requestAnimationFrame(place);
}

function dress(sec){
  const vis = Array.from(sec.querySelectorAll(".course")).filter(el => !el.hidden);
  sec.querySelector("[data-count]").textContent =
    vis.length + (vis.length === 1 ? " course" : " courses");
  if(vis.length >= 3) vis[0].classList.add("lead");
  return vis.length;
}

function dressVoid(q){
  const named = [];
  for(const f of FACETS)
    if(sel[f.key].size) named.push(f.name + ": " + Array.from(sel[f.key]).join(" or ") + ".");
  $("void-msg").textContent = query.trim()
    ? "Nothing matches \u201c" + query.trim() + "\u201d."
    : "No course answers all of that.";
  $("void-sub").textContent = named.length
    ? named.join(" ")
    : "Try fewer letters, or a town or a builder instead.";
}

function reset(){
  for(const f of FACETS) sel[f.key].clear();
  query = ""; input.value = ""; $("search-x").hidden = true;
  sortId = "book"; flat = false;
  for(const r of panel.querySelectorAll('input[name="sort"]')) r.checked = r.value === "book";
  $("flat").checked = false;
  apply();
}

// ---- events ----
input.addEventListener("input", () => {
  query = input.value;
  $("search-x").hidden = !query;
  apply();
});
$("search-x").addEventListener("click", () => {
  query = ""; input.value = ""; $("search-x").hidden = true; apply(); input.focus();
});

for(const chip of chips) chip.addEventListener("click", () => {
  if(chip.getAttribute("aria-disabled") === "true") return;
  const set = sel[chip.dataset.facet], v = chip.dataset.value;
  if(set.has(v)) set.delete(v); else set.add(v);
  apply();
});

panel.addEventListener("change", e => {
  if(e.target.name === "sort"){ sortId = e.target.value; apply(); }
  else if(e.target.id === "flat"){ flat = e.target.checked; apply(); }
  // the page's colour is not a filter: it survives Clear all, and it is kept
  else if(e.target.name === "theme"){ setTheme(e.target.value, true); }
});

railEl.addEventListener("click", e => {
  const t = e.target.closest(".tok");
  if(t){
    const k = t.dataset.kind;
    if(k === "more"){ openPanel(); return; }
    if(k === "q"){ query = ""; input.value = ""; $("search-x").hidden = true; }
    else if(k === "sort"){ sortId = "book"; $("sorts").querySelector('input[value="book"]').checked = true; }
    else if(k === "flat"){ flat = false; $("flat").checked = false; }
    else sel[k].delete(t.dataset.value);
    apply();
    return;
  }
  if(e.target.closest("#rail-clear")){ reset(); }
});

$("panel-clear").addEventListener("click", reset);
$("panel-done").addEventListener("click", closeSheet);
$("void-clear").addEventListener("click", () => {
  reset();
  scrollTo({ top:0 });
});
$("void-open").addEventListener("click", openPanel);

// ---- the sheets open over the page, and give the place back on the way out ----
// Filter and contents are the same piece of furniture: a drawer down the right
// edge on a wide screen, a sheet up from the bottom on a phone. One opener, one
// scrim, one focus trap, and only ever one of them open.
const S_TUNE = { el:panel, by:tune, head:"panel-h" };
const S_NAV  = { el:nav,   by:jump, head:"nav-h" };
let sheet = null, lastFocus = null;
const BEHIND = ["cover","bar","main","colophon","jump"].map(k =>
  document.querySelector(k === "main" ? "main" : "." + k)).filter(Boolean);
const setBehind = on => {
  if(!("inert" in HTMLElement.prototype)) return;
  for(const el of BEHIND) el.inert = on;
};
function openSheet(s){
  if(sheet === s) return;
  const wasOpen = !!sheet;
  if(sheet){ sheet.el.classList.remove("open"); sheet.by.setAttribute("aria-expanded","false"); }
  sheet = s;
  s.el.classList.add("open"); scrim.classList.add("open");
  s.by.setAttribute("aria-expanded","true");
  document.body.classList.add("held");
  if(!wasOpen){
    const gutter = innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = "hidden";
    if(gutter > 0) document.body.style.paddingRight = gutter + "px";
    lastFocus = document.activeElement === document.body ? s.by : document.activeElement;
    addEventListener("keydown", trap, true);
  }
  setBehind(true);
  $(s.head).focus({ preventScroll:true });
}
function closeSheet(){
  if(!sheet) return;
  const s = sheet; sheet = null;
  s.el.classList.remove("open"); scrim.classList.remove("open");
  s.by.setAttribute("aria-expanded","false");
  document.body.classList.remove("held");
  document.documentElement.style.overflow = "";
  document.body.style.paddingRight = "";
  removeEventListener("keydown", trap, true);
  setBehind(false);
  if(lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true });
}
// a declaration, not an expression: the rail and the empty state hand it to
// addEventListener further up the file
function openPanel(){ openSheet(S_TUNE); }
function trap(e){
  if(!sheet) return;
  if(e.key === "Escape"){ e.preventDefault(); closeSheet(); return; }
  if(e.key !== "Tab") return;
  const able = Array.from(sheet.el.querySelectorAll("button,input"))
    .filter(el => !el.disabled && (el.offsetParent !== null || el === document.activeElement));
  if(!able.length) return;
  const first = able[0], last = able[able.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
tune.addEventListener("click", () => sheet === S_TUNE ? closeSheet() : openSheet(S_TUNE));
jump.addEventListener("click", () => sheet === S_NAV  ? closeSheet() : openSheet(S_NAV));
$("panel-x").addEventListener("click", closeSheet);
$("nav-x").addEventListener("click", closeSheet);
scrim.addEventListener("click", closeSheet);

// a row in the contents takes you there, and takes the sheet away with it
$("nav-list").addEventListener("click", e => {
  const b = e.target.closest("button[data-to]");
  if(!b || b.disabled) return;
  const target = $(b.dataset.to);
  closeSheet();
  if(target) requestAnimationFrame(() => target.scrollIntoView({ block:"start" }));
});

apply();

// ---- the sticky bar's real height feeds scroll-padding, whatever it wraps to ----
let barTop = 0;
const measure = () => {
  document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
  barTop = parseFloat(getComputedStyle(bar).top) || 0;
};
measure();
if(window.ResizeObserver) new ResizeObserver(measure).observe(bar);
else addEventListener("resize", measure, { passive:true });

// the column count changes with the width, so the lone-card pass runs again
let rt = 0;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => { drawRail(); tidyRows(); place(); }, 120);
}, { passive:true });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(tidyRows).catch(() => {});

// ---- where you are, and the mark that says so ----
// There is no contents page on screen to scroll back to, so the mark stands
// on every scroll position and only stands down while its own sheet is up.
const SECS = sections.concat([allSec]);
let hereId = null;
function place(){
  const lip = bar.getBoundingClientRect().bottom;
  bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= barTop + 1);

  // the section you are in is the last one whose opener has passed the bar --
  // or, before the first opener has, the first one, since that is what is on
  // screen. Only an empty page leaves the mark with no section to name.
  let sec = null;
  for(const s of SECS) if(!s.hidden && s.getBoundingClientRect().top <= lip + 24) sec = s;
  if(!sec) sec = SECS.find(s => !s.hidden) || null;
  const id = sec ? sec.id : null;
  if(id === hereId) return;
  hereId = id;
  const name = sec ? sec.querySelector("h2").textContent : null;
  // The label stays put. Naming the section made the control as wide as the
  // longest section name, and it is a door, not a signpost -- the section you
  // are in is marked inside, where you look for it.
  jump.setAttribute("aria-label", name ? "Contents. You are in " + name : "Contents");
  for(const b of navBtns){
    if(b.dataset.to === id) b.setAttribute("aria-current","true");
    else b.removeAttribute("aria-current");
  }
}
let ticking = false;
addEventListener("scroll", () => {
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => { place(); ticking = false; });
}, { passive:true });
place();

// ---- printing: every photograph should be on the page before the sheet is made ----
addEventListener("beforeprint", () => {
  document.querySelectorAll('#groups img[loading="lazy"]').forEach(img => img.removeAttribute("loading"));
  tidyRows();
});

// ---- course details: everything GSPro's own course file says, on a click ----
// course-details.json and course-details/ are made on the sim laptop from
// C:\GSProV1\Core\GSP\Courses by extract_gspro_courses.py + make-course-images.ps1:
// tees, hole-by-hole card, the designer's default conditions, GSPro's pictures.
const ALIAS = { "shinnecock hills golf club":"shinnecock" };
const TEE_COLOUR = { Black:"#111", Blue:"#2456c9", White:"#f4f4f4", Green:"#2e8b43", Yellow:"#e7c02c",
  Red:"#c8322d", Junior:"#e58a2a", "Par 3":"#8a8a8a" };
const KW_LABEL = { MajorVenue:"Major venue", TourStop:"Tour stop", BeginnerFriendly:"Beginner friendly", LowPoly:"Low poly" };
let DETAILS = null;
function details(){
  if(!DETAILS) DETAILS = fetch("course-details.json").then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => { const m = new Map(); list.forEach(d => m.set(d.gspro.toLowerCase(), d)); return m; })
    .catch(e => { DETAILS = null; throw e; });
  return DETAILS;
}
const cdEl = $("cd"), cdIn = $("cd-in");
const n0 = v => v == null || v === "" ? "" : Number(v).toLocaleString("en");
const dot = t => '<span class="tee-dot" style="background:' + (TEE_COLOUR[t] || "#888") + '"></span>';

function holeTable(d){
  const h = d.scorecard, split = h.length > 9, front = h.slice(0, 9), back = h.slice(9);
  const key = t => t === "Par 3" ? "Par3" : t;
  const sum = (rows, f) => rows.reduce((a, r) => a + (+f(r) || 0), 0);
  const cells = rows => rows.map(r => "<th>" + esc(r.n) + "</th>").join("");
  const head = "<tr><th>Hole</th>" + cells(front) +
    (split ? '<th class="sum">Out</th>' + cells(back) + '<th class="sum">In</th>' : "") + '<th class="sum">Total</th></tr>';
  const line = (label, f, noSum) => {
    const td = rows => rows.map(r => "<td>" + esc(f(r) || "") + "</td>").join("");
    const tot = rows => '<td class="sum">' + (noSum ? "" : n0(sum(rows, f))) + "</td>";
    return "<tr><td>" + label + "</td>" + td(front) + (split ? tot(front) + td(back) + tot(back) : "") + tot(h) + "</tr>";
  };
  let body = d.tees.map(t => line(dot(t.tee) + esc(t.tee), r => r.yd[key(t.tee)])).join("");
  body += line("<b>Par</b>", r => r.par);
  if(h.some(r => r.index)) body += line("Index", r => r.index, true);
  return '<div class="cd-scroll"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";
}

function detailHTML(c, d){
  if(!d) return '<div class="cd-body"><div><h2 id="cd-h">' + esc(c.name) + '</h2><p class="cd-sub">' + esc(c.location || "") +
    '</p></div><p class="cd-desc">This course isn\'t installed on the sim, so there is no GSPro course file to read.</p></div>';
  const co = d.conditions;
  const box = (k, v) => (v == null || v === "" || v === false) ? "" : "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>";
  const facts = [
    box("Par", d.par), box("Holes", d.holes),
    box("Longest tee", d.tees[0] ? n0(d.tees[0].yards) + " yd" : ""), box("Tee sets", d.tees.length),
    box("Difficulty", d.difficulty ? esc(d.difficulty) + " / 10" : ""),
    box("Altitude", d.altitude_ft ? n0(d.altitude_ft) + " ft" : "Sea level"),
    box("Driving range", d.has_range ? "Yes" : "No"),
    box("Built by", esc(d.designer || c.designer || "")),
    box("Hazard areas", d.hazards),
    box("Download size", d.size_mb ? n0(d.size_mb) + " MB" : ""),
    box("Performance score", d.performance != null ? esc(d.performance) + " / 100" : ""),
    box("Course file dated", esc(d.file_date || ""))
  ].join("");
  const cond = [box("Wind", esc(co.wind)), box("Fairways", esc(co.fairways)), box("Greens", esc(co.greens)),
    box("Green speed", "Stimp " + esc(co.stimp)), box("Fastest allowed", "Stimp " + esc(co.max_stimp))].join("");
  const teeRows = d.tees.map(t => "<tr><td>" + dot(t.tee) + esc(t.tee) + "</td><td>" + n0(t.yards) + "</td><td>" + n0(t.metres) +
    "</td><td>" + (t.rating != null ? esc(t.rating) : "&ndash;") + "</td><td>" + (t.slope != null ? esc(t.slope) : "&ndash;") + "</td></tr>").join("");
  const kws = (d.keywords || []).map(k => '<span class="chip-k">' + esc(KW_LABEL[k] || k) + "</span>").join("");
  const alias = c.gspro && c.gspro !== c.name ? " &middot; listed in GSPro as <b>" + esc(c.gspro) + "</b>" : "";
  return (d.photo ? '<img class="cd-photo" src="' + esc(d.photo) + '" alt="' + esc(c.name) + ' in GSPro">' : "") +
    '<div class="cd-body"><div><h2 id="cd-h">' + esc(c.name) + '</h2><p class="cd-sub">' + esc(d.location || c.location || "") + alias + "</p></div>" +
    (d.description ? '<p class="cd-desc">' + esc(d.description) + "</p>" : "") +
    (kws ? "<div>" + kws + "</div>" : "") +
    '<section><h3>Tees</h3><div class="cd-scroll"><table><thead><tr><th>Tee</th><th>Yards</th><th>Metres</th><th>Rating</th><th>Slope</th></tr></thead><tbody>' +
      teeRows + '</tbody></table></div><p class="cd-note">Each player\'s tee is picked on GSPro\'s Players tab when the round is set up.</p></section>' +
    '<section><h3>How it plays</h3><dl class="cd-facts">' + cond + '</dl>' +
      '<p class="cd-note">The course designer\'s settings. GSPro starts a round with these; Match Settings can change them.</p></section>' +
    "<section><h3>Hole by hole (yards)</h3>" + holeTable(d) + "</section>" +
    '<section><h3>The course file</h3><dl class="cd-facts">' + facts + "</dl></section>" +
    (d.scorecard_image ? '<section><h3>GSPro\'s scorecard</h3><img class="cd-card" loading="lazy" src="' + esc(d.scorecard_image) +
      '" alt="GSPro scorecard for ' + esc(c.name) + '"></section>' : "") + "</div>";
}

let cdFrom = null;
async function openDetails(c, from){
  cdFrom = from;
  cdIn.innerHTML = '<div class="cd-body"><div><h2 id="cd-h">' + esc(c.name) + '</h2><p class="cd-sub">Reading the course file&hellip;</p></div></div>';
  if(!cdEl.open) cdEl.showModal();
  cdEl.scrollTop = 0;
  let d;
  try { const m = await details(); const k = (c.gspro || c.name).toLowerCase(); d = m.get(ALIAS[k] || k) || null; }
  catch(e){ cdIn.innerHTML = '<div class="cd-body"><h2 id="cd-h">' + esc(c.name) + '</h2><p class="cd-desc">The course details could not be loaded.</p></div>'; return; }
  cdIn.innerHTML = detailHTML(c, d);
}
$("groups").addEventListener("click", e => {
  const el = e.target.closest(".course"); if(el) openDetails(COURSES[+el.dataset.i], el);
});
$("groups").addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(".course"); if(!el || e.target !== el) return;
  e.preventDefault(); openDetails(COURSES[+el.dataset.i], el);
});
$("cd-x").addEventListener("click", () => cdEl.close());
cdEl.addEventListener("click", e => { if(e.target === cdEl) cdEl.close(); });
cdEl.addEventListener("close", () => { if(cdFrom) cdFrom.focus({ preventScroll:true }); });
</script>

</body></html>
